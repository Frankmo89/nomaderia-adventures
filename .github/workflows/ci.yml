name: CI

# Codifies the pre-PR gate from CLAUDE.md (tsc + build) plus tests and the
# vendored-engine drift check. Until this existed the gate was only a rule
# agents followed by hand, so SUPPORTED_ENGINE_VERSION / parity fixtures had
# nothing enforcing them on PRs.
#
# Type checking is per-project on purpose: the root tsconfig.json is
# `"files": []` + references, so a bare `tsc --noEmit` checks zero files
# (ADR-027). Edge Functions run on Deno, so tsc never sees them — deno check
# covers supabase/functions/.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check (app + node configs)
        run: npm run typecheck

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7

      - name: Cache Deno deps
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('supabase/functions/**/*.ts') }}
          restore-keys: deno-${{ runner.os }}-

      - name: Fetch Edge Function deps
        # Only this step touches the network. esm.sh 522s transiently (ADR-023),
        # so retry the fetch — never the type check, where a failure is real.
        run: |
          for attempt in 1 2 3; do
            deno cache --no-lock supabase/functions && exit 0
            echo "deno cache attempt $attempt/3 failed"
            [ "$attempt" -lt 3 ] && sleep $((10 * attempt))
          done
          exit 1

      - name: Type check (Edge Functions)
        run: deno check --no-lock --cached-only supabase/functions

      - name: Tests (includes engine parity fixtures + SUPPORTED_ENGINE_VERSION guard)
        run: npm test

      - name: Vendored engine matches its pin
        run: npm run verify:engine

      - name: Build
        # `npm run build` also runs generate-sitemap, which needs Supabase env
        # vars and hard-fails under CI=true. Cloudflare Pages owns the sitemap;
        # here we only prove the bundle compiles.
        run: npx tsx scripts/build-soul.ts && npx vite build

  sql-tests:
    # Trigger behaviour for the content-driven knowledge ingest, proven against
    # a throwaway Postgres 17 (prod version) with stubbed pg_net/Vault. Never
    # touches Supabase: the stub schema refuses to load into a Supabase DB.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: SQL trigger tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: scripts/test-sql.sh
